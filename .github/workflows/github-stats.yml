name: Update GitHub Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "17 00 * * *"

  push:
    paths:
      - "scripts/update_github_stats.py"
      - "assets/github-stats.svg"

permissions:
  contents: write

jobs:

  update-stats:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update GitHub statistics
        env:
          GITHUB_USERNAME: ItsRiku237
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          python scripts/update_github_stats.py

      - name: Commit updated SVG
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg

          git diff --cached --quiet && exit 0

          git commit -m "chore: update GitHub contribution stats"

          git push