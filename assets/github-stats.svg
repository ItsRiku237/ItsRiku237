<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="300"
     viewBox="0 0 1200 300"
     role="img"
     aria-label="GitHub contribution statistics">

<defs>

  <linearGradient id="accent"
                  x1="0"
                  y1="0"
                  x2="1"
                  y2="1">
    <stop offset="0" stop-color="#e7b45a"/>
    <stop offset=".5" stop-color="#70c9bd"/>
    <stop offset="1" stop-color="#8f8be8"/>
  </linearGradient>

  <filter id="glow"
          x="-50%"
          y="-50%"
          width="200%"
          height="200%">
    <feGaussianBlur stdDeviation="2.5"
                    result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- ================================================== -->
<!-- PAGE -->
<!-- ================================================== -->

<rect x="0"
      y="0"
      width="1200"
      height="300"
      fill="#0b0d0f"/>


<!-- ================================================== -->
<!-- HEADER -->
<!-- ================================================== -->

<text x="55"
      y="40"
      fill="#8f8c85"
      font-family="monospace"
      font-size="11"
      letter-spacing="3">
  05 — GITHUB TELEMETRY
</text>

<text x="1145"
      y="40"
      text-anchor="end"
      fill="#70c9bd"
      font-family="monospace"
      font-size="10"
      letter-spacing="1">
  LIVE ACTIVITY
</text>


<line x1="55"
      y1="55"
      x2="1145"
      y2="55"
      stroke="#24282b"/>


<text x="55"
      y="84"
      fill="#f1ede4"
      font-family="Georgia, serif"
      font-size="32"
      font-weight="700">
  Activity, not decoration.
</text>


<text x="55"
      y="108"
      fill="#77746e"
      font-family="monospace"
      font-size="10">
  CONTRIBUTION SIGNAL → CONSISTENCY → SHIPPED SYSTEMS
</text>


<!-- ================================================== -->
<!-- THREE TELEMETRY BOXES -->
<!-- ================================================== -->

<g transform="translate(55 130)">


<!-- ================================================== -->
<!-- BOX 1 — TOTAL CONTRIBUTIONS -->
<!-- ================================================== -->

<rect x="0"
      y="0"
      width="330"
      height="110"
      rx="4"
      fill="#111417"
      stroke="#2a3036"
      stroke-width="1.2"/>

<!-- Top accent -->
<line x1="0"
      y1="0"
      x2="65"
      y2="0"
      stroke="#70c9bd"
      stroke-width="2"/>

<!-- Card label -->
<text x="22"
      y="26"
      fill="#70c9bd"
      font-family="monospace"
      font-size="11"
      font-weight="700"
      letter-spacing="2">
  01 / CONTRIBUTIONS
</text>

<!-- Verified badge -->
<rect x="236"
      y="13"
      width="72"
      height="18"
      rx="2"
      fill="#141c1b"
      stroke="#1f3b37"
      stroke-width="1"/>
<text x="272"
      y="25"
      text-anchor="middle"
      fill="#70c9bd"
      font-family="monospace"
      font-size="9"
      font-weight="700"
      letter-spacing="1">
  VERIFIED
</text>

<!-- Contribution checkmark icon -->
<g transform="translate(22 43)">
  <circle cx="14"
          cy="14"
          r="14"
          fill="#101e1e"
          stroke="#277a73"/>
  <path d="M8 14 L12 18 L20 9"
        fill="none"
        stroke="#58c9c0"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</g>

<!-- NUMBER -->
<text x="58"
      y="68"
      fill="#f1ede4"
      font-family="'JetBrains Mono', 'Segoe UI', Arial, sans-serif"
      font-size="38"
      font-weight="800">
  856
</text>

<!-- Metric descriptor label -->
<g transform="translate(160 46)">
  <text x="0"
        y="13"
        fill="#70c9bd"
        font-family="monospace"
        font-size="12"
        font-weight="700"
        letter-spacing="1.5">
    TOTAL
  </text>
  <text x="0"
        y="26"
        fill="#8f8c85"
        font-family="monospace"
        font-size="9"
        letter-spacing="0.8">
    LIFETIME COMMITS
  </text>
</g>

<!-- Divider -->
<line x1="22"
      y1="84"
      x2="308"
      y2="84"
      stroke="#1f2428"
      stroke-width="1"/>

<!-- RANGE -->
<g transform="translate(22 98)">
  <circle cx="3"
          cy="-3.5"
          r="3"
          fill="#70c9bd"/>
  <text x="13"
        y="0"
        fill="#b0aca4"
        font-family="monospace"
        font-size="10.5"
        font-weight="600"
        letter-spacing="0.5">
    Oct 04, 2025 → Oct 26, 2026
  </text>
</g>


<!-- ================================================== -->
<!-- BOX 2 — CURRENT STREAK -->
<!-- ================================================== -->

<rect x="350"
      y="0"
      width="330"
      height="110"
      rx="4"
      fill="#111417"
      stroke="#2a3036"
      stroke-width="1.2"/>

<!-- Top accent -->
<line x1="350"
      y1="0"
      x2="415"
      y2="0"
      stroke="#e7b45a"
      stroke-width="2"/>

<!-- Card label -->
<text x="372"
      y="26"
      fill="#e7b45a"
      font-family="monospace"
      font-size="11"
      font-weight="700"
      letter-spacing="2">
  02 / CURRENT STREAK
</text>

<!-- Streak badge -->
<rect x="586"
      y="13"
      width="72"
      height="18"
      rx="2"
      fill="#241e12"
      stroke="#4a3b1d"
      stroke-width="1"/>
<text x="622"
      y="25"
      text-anchor="middle"
      fill="#e7b45a"
      font-family="monospace"
      font-size="9"
      font-weight="700"
      letter-spacing="1">
  STREAK
</text>

<!-- Flame icon -->
<g transform="translate(372 40)">
  <!-- glow -->
  <path d="
    M14 2
    C8 8 4 12 4 19
    C4 27 10 32 17 32
    C24 32 30 27 30 19
    C30 13 26 8 21 4
    C22 10 19 13 16 15
    C17 9 16 6 14 2 Z"
    fill="#e7b45a"
    opacity=".25"
    filter="url(#glow)"/>
  <!-- flame body -->
  <path d="
    M14 2
    C8 8 4 12 4 19
    C4 27 10 32 17 32
    C24 32 30 27 30 19
    C30 13 26 8 21 4
    C22 10 19 13 16 15
    C17 9 16 6 14 2 Z"
    fill="#e7b45a"/>
  <!-- inner flame -->
  <path d="
    M17 14
    C14 18 12 21 12 24
    C12 27 14 29 17 29
    C20 29 22 27 22 24
    C22 20 20 18 17 14 Z"
    fill="#0b0d0f"/>
</g>

<!-- STREAK RING & NUMBER -->
<g transform="translate(435 58)">
  <circle cx="0"
          cy="0"
          r="20"
          fill="none"
          stroke="#22272b"
          stroke-width="4.5"/>
  <circle cx="0"
          cy="0"
          r="20"
          fill="none"
          stroke="url(#accent)"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-dasharray="100 15"
          transform="rotate(-90)"
          filter="url(#glow)"/>
  <!-- NUMBER -->
  <text x="0"
        y="7"
        text-anchor="middle"
        fill="#f1ede4"
        font-family="'JetBrains Mono', 'Segoe UI', Arial, sans-serif"
        font-size="20"
        font-weight="800">
    1
  </text>
</g>

<!-- Metric descriptor label -->
<g transform="translate(472 46)">
  <text x="0"
        y="13"
        fill="#e7b45a"
        font-family="monospace"
        font-size="12"
        font-weight="700"
        letter-spacing="1.5">
    DAYS
  </text>
  <text x="0"
        y="26"
        fill="#8f8c85"
        font-family="monospace"
        font-size="9"
        letter-spacing="0.8">
    CONTINUOUS STREAK
  </text>
</g>

<!-- Divider -->
<line x1="372"
      y1="84"
      x2="658"
      y2="84"
      stroke="#1f2428"
      stroke-width="1"/>

<!-- RANGE -->
<g transform="translate(372 98)">
  <circle cx="3"
          cy="-3.5"
          r="3"
          fill="#e7b45a"/>
  <text x="13"
        y="0"
        fill="#b0aca4"
        font-family="monospace"
        font-size="10.5"
        font-weight="600"
        letter-spacing="0.5">
    ACTIVE → Oct 26
  </text>
</g>


<!-- ================================================== -->
<!-- BOX 3 — LONGEST STREAK -->
<!-- ================================================== -->

<rect x="700"
      y="0"
      width="390"
      height="110"
      rx="4"
      fill="#111417"
      stroke="#2a3036"
      stroke-width="1.2"/>

<!-- Top accent -->
<line x1="700"
      y1="0"
      x2="765"
      y2="0"
      stroke="#8f8be8"
      stroke-width="2"/>

<!-- Card label -->
<text x="722"
      y="26"
      fill="#8f8be8"
      font-family="monospace"
      font-size="11"
      font-weight="700"
      letter-spacing="2">
  03 / LONGEST STREAK
</text>

<!-- Record badge -->
<rect x="990"
      y="13"
      width="78"
      height="18"
      rx="2"
      fill="#1d1c2b"
      stroke="#3b3857"
      stroke-width="1"/>
<text x="1029"
      y="25"
      text-anchor="middle"
      fill="#8f8be8"
      font-family="monospace"
      font-size="9"
      font-weight="700"
      letter-spacing="1">
  RECORD
</text>

<!-- Trophy icon -->
<g transform="translate(722 41)">
  <!-- Cup -->
  <path d="
    M6 3
    H32
    V14
    C32 22 27 27 19 29
    C11 27 6 22 6 14 Z"
    fill="none"
    stroke="#e7b45a"
    stroke-width="2.2"/>
  <!-- Handles -->
  <path d="
    M6 8
    H2
    C0.5 8 0.5 11 2 15
    C3 17 5 18 7 18"
    fill="none"
    stroke="#e7b45a"
    stroke-width="1.8"/>
  <path d="
    M32 8
    H36
    C37.5 8 37.5 11 36 15
    C35 17 33 18 31 18"
    fill="none"
    stroke="#e7b45a"
    stroke-width="1.8"/>
  <!-- Stem & base -->
  <line x1="19"
        y1="29"
        x2="19"
        y2="34"
        stroke="#e7b45a"
        stroke-width="2"/>
  <line x1="11"
        y1="35"
        x2="27"
        y2="35"
        stroke="#e7b45a"
        stroke-width="2.5"/>
</g>

<!-- NUMBER -->
<text x="776"
      y="68"
      fill="#f1ede4"
      font-family="'JetBrains Mono', 'Segoe UI', Arial, sans-serif"
      font-size="38"
      font-weight="800">
  77
</text>

<!-- Metric descriptor label -->
<g transform="translate(845 46)">
  <text x="0"
        y="13"
        fill="#8f8be8"
        font-family="monospace"
        font-size="12"
        font-weight="700"
        letter-spacing="1.5">
    DAYS
  </text>
  <text x="0"
        y="26"
        fill="#8f8c85"
        font-family="monospace"
        font-size="9"
        letter-spacing="0.8">
    ALL-TIME BEST
  </text>
</g>

<!-- Divider -->
<line x1="722"
      y1="84"
      x2="1068"
      y2="84"
      stroke="#1f2428"
      stroke-width="1"/>

<!-- RANGE -->
<g transform="translate(722 98)">
  <circle cx="3"
          cy="-3.5"
          r="3"
          fill="#8f8be8"/>
  <text x="13"
        y="0"
        fill="#b0aca4"
        font-family="monospace"
        font-size="10.5"
        font-weight="600"
        letter-spacing="0.5">
    Feb 15 → May 02
  </text>
</g>

</g>


<!-- ================================================== -->
<!-- FOOTER -->
<!-- ================================================== -->

<line x1="55"
      y1="270"
      x2="1145"
      y2="270"
      stroke="#24282b"/>

<circle cx="55"
        cy="270"
        r="3"
        fill="#70c9bd"
        filter="url(#glow)"/>

<text x="68"
      y="274"
      fill="#77746e"
      font-family="monospace"
      font-size="9"
      letter-spacing="1">
  GITHUB CONTRIBUTION SIGNAL
</text>

<text x="1145"
      y="274"
      text-anchor="end"
      fill="#77746e"
      font-family="monospace"
      font-size="9">
  AUTO-SYNCED DAILY
</text>

</svg>