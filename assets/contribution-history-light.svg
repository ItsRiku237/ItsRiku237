<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="300"
     viewBox="0 0 1200 300"
     role="img"
     aria-label="GitHub contribution activity graph">

<defs>

  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <linearGradient id="graphLine"
                  x1="0" y1="0"
                  x2="1" y2="0">
    <stop offset="0" stop-color="#3b9d92"/>
    <stop offset=".5" stop-color="#d99a32"/>
    <stop offset="1" stop-color="#3b9d92"/>
  </linearGradient>

</defs>

<!-- BACKGROUND -->

<rect width="1200"
      height="300"
      fill="#f7f5ef"/>

<!-- HEADER -->

<text x="55" y="35"
      fill="#77736c"
      font-family="monospace"
      font-size="11"
      letter-spacing="3">
  08 — CONTRIBUTION HISTORY
</text>

<text x="1145" y="35"
      text-anchor="end"
      fill="#4b968e"
      font-family="monospace"
      font-size="10">
  LAST 30 DAYS
</text>

<line x1="55" y1="52"
      x2="1145" y2="52"
      stroke="#d9d5cc"/>

<!-- TITLE -->

<text x="55" y="82"
      fill="#252421"
      font-family="Georgia, serif"
      font-size="25"
      font-weight="700">
  Contribution activity
</text>

<text x="1145" y="82"
      text-anchor="end"
      fill="#3b9d92"
      font-family="monospace"
      font-size="10">
  LIVE GITHUB SIGNAL
</text>

<!-- GRAPH AREA -->

<g transform="translate(75 105)">

  <!-- horizontal grid -->

  <line x1="0" y1="0"
        x2="1050" y2="0"
        stroke="#d7d4cc"
        stroke-dasharray="3 4"/>

  <line x1="0" y1="70"
        x2="1050" y2="70"
        stroke="#d7d4cc"
        stroke-dasharray="3 4"/>

  <line x1="0" y1="140"
        x2="1050" y2="140"
        stroke="#d7d4cc"
        stroke-dasharray="3 4"/>

  <!-- Y labels -->

  <text x="-18" y="5"
        text-anchor="end"
        fill="#77736c"
        font-family="monospace"
        font-size="9">
    2
  </text>

  <text x="-18" y="75"
        text-anchor="end"
        fill="#77736c"
        font-family="monospace"
        font-size="9">
    1
  </text>

  <text x="-18" y="145"
        text-anchor="end"
        fill="#77736c"
        font-family="monospace"
        font-size="9">
    0
  </text>

  <!-- VERTICAL GRID -->

  <g stroke="#e2dfd7"
     stroke-dasharray="2 5">

    <line x1="0" y1="0" x2="0" y2="140"/>
    <line x1="37" y1="0" x2="37" y2="140"/>
    <line x1="74" y1="0" x2="74" y2="140"/>
    <line x1="111" y1="0" x2="111" y2="140"/>
    <line x1="148" y1="0" x2="148" y2="140"/>
    <line x1="185" y1="0" x2="185" y2="140"/>
    <line x1="222" y1="0" x2="222" y2="140"/>
    <line x1="259" y1="0" x2="259" y2="140"/>
    <line x1="296" y1="0" x2="296" y2="140"/>
    <line x1="333" y1="0" x2="333" y2="140"/>
    <line x1="370" y1="0" x2="370" y2="140"/>
    <line x1="407" y1="0" x2="407" y2="140"/>
    <line x1="444" y1="0" x2="444" y2="140"/>
    <line x1="481" y1="0" x2="481" y2="140"/>
    <line x1="518" y1="0" x2="518" y2="140"/>
    <line x1="555" y1="0" x2="555" y2="140"/>
    <line x1="592" y1="0" x2="592" y2="140"/>
    <line x1="629" y1="0" x2="629" y2="140"/>
    <line x1="666" y1="0" x2="666" y2="140"/>
    <line x1="703" y1="0" x2="703" y2="140"/>
    <line x1="740" y1="0" x2="740" y2="140"/>
    <line x1="777" y1="0" x2="777" y2="140"/>
    <line x1="814" y1="0" x2="814" y2="140"/>
    <line x1="851" y1="0" x2="851" y2="140"/>
    <line x1="888" y1="0" x2="888" y2="140"/>
    <line x1="925" y1="0" x2="925" y2="140"/>
    <line x1="962" y1="0" x2="962" y2="140"/>
    <line x1="999" y1="0" x2="999" y2="140"/>
    <line x1="1036" y1="0" x2="1036" y2="140"/>

  </g>

  <!-- GRAPH LINE -->

  <polyline
    id="contribution-line"
    points="{{GRAPH_POINTS}}"
    fill="none"
    stroke="url(#graphLine)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- DATA POINTS -->

  <g id="contribution-points"
     fill="#3b9d92">

    {{GRAPH_POINTS_CIRCLES}}

  </g>

  <!-- DATES -->

  <g fill="#77736c"
     font-family="monospace"
     font-size="9"
     text-anchor="middle">

    {{GRAPH_DATES}}

  </g>

</g>

<!-- FOOTER -->

<circle cx="60" cy="284"
        r="4"
        fill="#3b9d92"
        filter="url(#glow)"/>

<text x="73" y="288"
      fill="#77736c"
      font-family="monospace"
      font-size="9"
      letter-spacing="1">
  DAILY CONTRIBUTION TRACE
</text>

<text x="1140" y="288"
      text-anchor="end"
      fill="#77736c"
      font-family="monospace"
      font-size="9">
  PEAK → {{PEAK_CONTRIBUTIONS}} CONTRIBUTIONS
</text>

</svg>