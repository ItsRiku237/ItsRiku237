<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Riku engineering portfolio visualization">
<defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#70c9bd"/>
    <stop offset="0.5" stop-color="#8f8be8"/>
    <stop offset="1" stop-color="#e7b45a"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Mask for SVG background grid lines: left content is normal, inside the radar box lines fade out towards the center -->
  <radialGradient id="heroCenterFadeDark" cx="951" cy="238" r="200" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04"/>
    <stop offset="70%" stop-color="#ffffff" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
  </radialGradient>
  <mask id="heroGridMaskDark">
    <!-- Keep background lines on left side completely intact -->
    <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
    <!-- Fade background lines towards the center inside the radar box -->
    <rect x="760" y="0" width="440" height="420" fill="url(#heroCenterFadeDark)"/>
  </mask>
</defs>

<rect width="1200" height="420" fill="#0b0d0f"/>

<!-- SVG BACKGROUND GRID (Removed Y=80 line to eliminate top double-line; fades towards center inside radar box) -->
<g opacity=".16" stroke="#c7c3b8" stroke-width="1" mask="url(#heroGridMaskDark)">
  <path d="M40 140H1160M40 200H1160M40 260H1160M40 320H1160"/>
  <path d="M160 30V390M280 30V390M400 30V390M520 30V390M640 30V390M760 30V390M880 30V390M1000 30V390"/>
</g>

<g fill="#9b9991" font-family="monospace" font-size="11" letter-spacing="2">
  <text x="58" y="42">RIKU / ENGINEERING IDENTITY</text>
  <text x="1040" y="42">01—08</text>
  <text x="58" y="384">B.TECH CSE · 2028</text>
  <text x="930" y="384">OPEN TO OPPORTUNITIES</text>
</g>
<path d="M58 70H1142" stroke="#30343a"/>

<!-- LEFT CONTENT -->
<text x="58" y="165" fill="#f3efe6" font-family="Georgia, serif" font-size="88" letter-spacing="-3">Riku</text>
<text x="62" y="206" fill="#70c9bd" font-family="monospace" font-size="14" font-weight="700" letter-spacing="3">FULL-STACK MERN  →  AI / ML</text>
<text x="62" y="244" fill="#d9d4c9" font-family="Arial, sans-serif" font-size="17">Building web systems with a bias toward structure, realtime behavior and useful detail.</text>

<!-- System / UI / APIs / Data Badge (Increased font size & coverage) -->
<rect x="58" y="278" width="310" height="44" rx="2" fill="#121519" stroke="#34383d"/>
<circle cx="78" cy="300" r="4" fill="#70c9bd" filter="url(#glow)"/>
<text x="92" y="305" fill="#f1ede4" font-family="monospace" font-size="13.5" font-weight="700" letter-spacing="1.2">SYSTEMS · UI · APIs · DATA</text>

<!-- ========================================================= -->
<!-- RIGHT PANEL: UNCLUTTERED ENGINEERING IDENTITY DIAGRAM     -->
<!-- ========================================================= -->
<g transform="translate(760 90)">

  <!-- 1. SQUARE BOX LINE MATCHING BACKGROUND (NO COVER BOX) -->
  <rect x="0" y="0" width="382" height="252" rx="2"
        fill="none" stroke="#252a30" stroke-width="1.2"/>

  <!-- Minimal Corner Ticks -->
  <path d="M0 10 L0 0 L10 0 M372 0 L382 0 L382 10 M0 242 L0 252 L10 252 M372 252 L382 252 L382 242"
        fill="none" stroke="#70c9bd" stroke-width="1.5"/>

  <!-- Header Bar -->
  <text x="18" y="25"
        fill="#8f8c85"
        font-family="monospace"
        font-size="10"
        font-weight="700"
        letter-spacing="2">RADAR // DOMAIN TRAJECTORY</text>

  <circle cx="364" cy="22" r="3" fill="#70c9bd" filter="url(#glow)"/>
  <text x="354" y="25"
        text-anchor="end"
        fill="#70c9bd"
        font-family="monospace"
        font-size="9"
        letter-spacing="1">ACTIVE</text>

  <line x1="18" y1="35" x2="364" y2="35" stroke="#1c2126" stroke-width="1"/>

  <!-- 2. DIAGRAM VISUALIZATION (CENTERED AT 191, 148) -->
  <g transform="translate(191 148)">

    <!-- Crosshair axes -->
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#181d22" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#181d22" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- Concentric domain rings -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#20252b" stroke-width="1"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#20252b" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Trajectory Vector Beam -->
    <line x1="-80" y1="42" x2="78" y2="-44"
          stroke="url(#grad)"
          stroke-width="2.5"
          stroke-linecap="round"/>

    <!-- Vector Arrowhead -->
    <polygon points="80,-45 68,-44 74,-35" fill="#e7b45a"/>

    <!-- Center Pivot: DATA · APIs -->
    <circle cx="0" cy="0" r="4" fill="#8f8be8" filter="url(#glow)"/>
    <text x="0" y="-10"
          text-anchor="middle"
          fill="#8f8be8"
          font-family="monospace"
          font-size="8.5"
          font-weight="700"
          letter-spacing="0.8">DATA / APIs</text>

    <!-- Node 1: FOUNDATION (MERN) -->
    <g transform="translate(-80 42)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#70c9bd" stroke-width="1" stroke-dasharray="2 3"/>
      <circle cx="0" cy="0" r="4.5" fill="#70c9bd" filter="url(#glow)"/>
      <text x="0" y="18"
            text-anchor="middle"
            fill="#70c9bd"
            font-family="monospace"
            font-size="9"
            font-weight="700"
            letter-spacing="1">FOUNDATION</text>
      <text x="0" y="28"
            text-anchor="middle"
            fill="#8f8c85"
            font-family="monospace"
            font-size="8"
            letter-spacing="0.5">MERN SYSTEMS</text>
    </g>

    <!-- Node 2: EXPANDING (AI/ML) -->
    <g transform="translate(80 -44)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#e7b45a" stroke-width="1" stroke-dasharray="2 3"/>
      <circle cx="0" cy="0" r="4.5" fill="#e7b45a" filter="url(#glow)"/>
      <text x="0" y="-18"
            text-anchor="middle"
            fill="#e7b45a"
            font-family="monospace"
            font-size="9"
            font-weight="700"
            letter-spacing="1">EXPANDING</text>
      <text x="0" y="-8"
            text-anchor="middle"
            fill="#8f8c85"
            font-family="monospace"
            font-size="8"
            letter-spacing="0.5">AI / ML MODELS</text>
    </g>

    <!-- Vector Trajectory Label -->
    <text x="-12" y="32"
          fill="#8f8c85"
          font-family="monospace"
          font-size="8"
          letter-spacing="1">TRAJECTORY VECTOR</text>

    <!-- Radar Scope Angle Marks -->
    <line x1="-120" y1="-70" x2="-112" y2="-70" stroke="#1d2228" stroke-width="1"/>
    <line x1="-120" y1="-70" x2="-120" y2="-62" stroke="#1d2228" stroke-width="1"/>
    <line x1="120" y1="70" x2="112" y2="70" stroke="#1d2228" stroke-width="1"/>
    <line x1="120" y1="70" x2="120" y2="62" stroke="#1d2228" stroke-width="1"/>

  </g>

  <!-- 3. FOOTER LEGEND / STATUS BAR (Line removed above text as requested) -->
  <circle cx="26" cy="239" r="2.5" fill="#70c9bd"/>
  <text x="34" y="242"
        fill="#77746e"
        font-family="monospace"
        font-size="8"
        letter-spacing="0.5">PROVEN: WEB ARCHITECTURE</text>

  <circle cx="210" cy="239" r="2.5" fill="#e7b45a"/>
  <text x="218" y="242"
        fill="#77746e"
        font-family="monospace"
        font-size="8"
        letter-spacing="0.5">EXPLORING: INTELLIGENT SYSTEMS</text>

</g>

</svg>