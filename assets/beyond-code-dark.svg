<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Riku engineering portfolio visualization">
<defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e7b45a"/>
    <stop offset="0.52" stop-color="#70c9bd"/>
    <stop offset="1" stop-color="#8f8be8"/>
  </linearGradient>
  <linearGradient id="soft" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e7b45a" stop-opacity=".0"/>
    <stop offset=".5" stop-color="#70c9bd" stop-opacity=".7"/>
    <stop offset="1" stop-color="#8f8be8" stop-opacity=".0"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="360" fill="#0b0d0f"/>
