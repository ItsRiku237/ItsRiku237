<text x="60" y="100" fill="#f1ede4" font-family="Georgia,serif" font-size="43">Precision × Composition</text>
<text x="62" y="135" fill="#85827b" font-family="monospace" font-size="11">ENGINEERING / structure · systems · proportion</text>
<text x="62" y="157" fill="#85827b" font-family="monospace" font-size="11">ART / gesture · balance · iteration</text>
